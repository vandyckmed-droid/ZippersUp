<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>12-1 Momentum Rank</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--line:#e5e7eb;--up:#0a7f3f;--dn:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--line:#2a2f36;--up:#4ade80;--dn:#f87171}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}.sub{color:var(--mut);font-size:.85rem;margin-bottom:12px}
input{width:100%;box-sizing:border-box;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{cursor:pointer;color:var(--mut);font-weight:600;user-select:none}
th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left}
.up{color:var(--up)}.dn{color:var(--dn)}svg{vertical-align:middle}
</style></head><body><main>
<h1>12-1 Momentum Rank</h1>
<div class="sub" id="sub">Loading…</div>
<input id="q" placeholder="Filter by ticker, name or sector">
<div class="wrap"><table><thead><tr>
<th data-k="rank">#</th><th data-k="symbol">Ticker</th><th data-k="name">Name</th>
<th data-k="sector">Sector</th><th data-k="marketCap">Mkt cap ($B)</th>
<th data-k="mom">12-1 log ret</th><th data-k="mom">≈ %</th><th>4y</th>
</tr></thead><tbody id="b"></tbody></table></div>
<p class="sub">12-1 momentum = ln(P<sub>t−1m</sub> / P<sub>t−12m</sub>) using dividend-adjusted EOD closes, skipping the most recent month. Top 100 US stocks by market cap. Data: Financial Modeling Prep, refreshed each weekday.</p>
<script>
let rows=[],key="rank",dir=1;
const f=(x,d=3)=>x==null?"–":x.toFixed(d);
function spark(a){const w=90,h=22,mn=Math.min(...a),mx=Math.max(...a);
const pts=a.map((v,i)=>(i/(a.length-1)*w).toFixed(1)+","+(h-(v-mn)/(mx-mn||1)*h).toFixed(1)).join(" ");
const c=a[a.length-1]>=a[0]?"var(--up)":"var(--dn)";
return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`}
function render(){const q=document.getElementById("q").value.toLowerCase();
const r=rows.filter(s=>(s.symbol+s.name+(s.sector||"")).toLowerCase().includes(q))
.sort((a,b)=>{const x=a[key]??-1e18,y=b[key]??-1e18;return (x>y?1:x<y?-1:0)*dir});
document.getElementById("b").innerHTML=r.map(s=>{const c=s.mom==null?"":s.mom>=0?"up":"dn";
return `<tr><td>${s.rank??"–"}</td><td><b>${s.symbol}</b></td><td>${s.name||""}</td><td>${s.sector||""}</td>
<td>${(s.marketCap/1e9).toFixed(0)}</td><td class="${c}">${f(s.mom)}</td>
<td class="${c}">${s.mom==null?"–":((Math.exp(s.mom)-1)*100).toFixed(1)+"%"}</td><td>${spark(s.spark)}</td></tr>`}).join("")}
document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;
dir=k===key?-dir:(k==="symbol"||k==="name"||k==="sector"||k==="rank"?1:-1);key=k;render()});
document.getElementById("q").oninput=render;
fetch("data.json").then(r=>r.json()).then(d=>{rows=d.stocks;
document.getElementById("sub").textContent=`As of ${d.asOf} · window ${d.from12} → ${d.to1} · ${rows.filter(s=>s.mom!=null).length} ranked`;render()})
.catch(e=>document.getElementById("sub").textContent="Failed to load data.json: "+e);
</script></main></body></html>
